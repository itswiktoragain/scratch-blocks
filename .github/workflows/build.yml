name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - run: npm run test:lint
    - name: Check Dry Eggs horizontal layout syntax
      run: |
        node --check shim/dry-eggs-horizontal-layout.js
        node --check shim/horizontal.js
    - name: Build distributable blocks
      run: npm run prepublish
    - name: Smoke-test complete horizontal catalogue and layout
      run: |
        node <<'NODE'
        const fs = require('fs');
        const catalogue = fs.readFileSync('blocks_compressed_horizontal.js', 'utf8');
        const required = [
          'motion_movesteps',
          'looks_costume',
          'sound_sounds_menu',
          'sensing_of_object_menu',
          'operator_add',
          'data_variable',
          'procedures_call',
          'event_broadcast_menu',
          'event_broadcast',
          'event_whenbroadcastreceived'
        ];
        for (const name of required) {
          if (!catalogue.includes('Blockly.Blocks.' + name)) {
            throw new Error(`Horizontal catalogue is missing ${name}`);
          }
        }

        const core = fs.readFileSync('blockly_compressed_horizontal.js', 'utf8');
        if (!core.includes('HorizontalFlyout')) {
          throw new Error('HorizontalFlyout is missing from horizontal Blockly core');
        }

        const horizontalShim = fs.readFileSync('shim/blocks_compressed_horizontal.js', 'utf8');
        if (!horizontalShim.includes('goog=./shim/blockly_compressed_horizontal.goog')) {
          throw new Error('Horizontal blocks shim is not injecting Closure goog helpers');
        }

        const entryShim = fs.readFileSync('shim/horizontal.js', 'utf8');
        if (!entryShim.includes("require('./dry-eggs-horizontal-layout')(Blockly)")) {
          throw new Error('Horizontal entry shim is not loading the Dry Eggs layout layer');
        }

        const layout = fs.readFileSync('shim/dry-eggs-horizontal-layout.js', 'utf8');
        for (const token of [
          '__dryEggsHorizontalLayoutV3',
          'contentItems',
          'OUTPUT_SHAPE_HEXAGONAL',
          'OUTPUT_SHAPE_ROUND',
          'connection.setOffsetInBlock(localX, centerY)',
          'connection.moveToOffset(blockXY)',
          'if (targetConnection) connection.tighten_();',
          "shapes.push('boolean')",
          "shapes.push('round')"
        ]) {
          if (!layout.includes(token)) {
            throw new Error(`Dry Eggs horizontal layout is missing regression token: ${token}`);
          }
        }
        if (layout.includes('if (targetConnection) targetConnection.tighten_();')) {
          throw new Error('Horizontal input layout still tightens from the child connection');
        }

        const horizontalEvents = fs.readFileSync('blocks_horizontal/event.js', 'utf8');
        for (const forbidden of [
          "Blockly.Blocks['event_broadcast']",
          "Blockly.Blocks['event_broadcastandwait']",
          "Blockly.Blocks['event_whenbroadcastreceived']"
        ]) {
          if (horizontalEvents.includes(forbidden)) {
            throw new Error(`Horizontal events still override normal Scratch messaging: ${forbidden}`);
          }
        }

        for (const output of ['dist/horizontal.js', 'shim/horizontal.js']) {
          if (!fs.existsSync(output)) {
            throw new Error(`Horizontal distribution file is missing: ${output}`);
          }
        }
        console.log('Horizontal Dry Eggs positioning and message smoke test passed.');
        NODE
