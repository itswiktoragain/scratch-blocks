name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - run: npm run test:lint
    - name: Build distributable blocks
      run: npm run prepublish
    - name: Smoke-test complete horizontal catalogue
      run: |
        node <<'NODE'
        const fs = require('fs');
        const catalogue = fs.readFileSync('blocks_compressed_horizontal.js', 'utf8');
        const required = [
          'motion_movesteps',
          'looks_costume',
          'sound_sounds_menu',
          'sensing_of_object_menu',
          'operator_add',
          'data_variable',
          'procedures_call'
        ];
        for (const name of required) {
          if (!catalogue.includes('Blockly.Blocks.' + name)) {
            throw new Error(`Horizontal catalogue is missing ${name}`);
          }
        }
        const core = fs.readFileSync('blockly_compressed_horizontal.js', 'utf8');
        if (!core.includes('HorizontalFlyout')) {
          throw new Error('HorizontalFlyout is missing from horizontal Blockly core');
        }
        const horizontalShim = fs.readFileSync('shim/blocks_compressed_horizontal.js', 'utf8');
        if (!horizontalShim.includes('goog=./shim/blockly_compressed_horizontal.goog')) {
          throw new Error('Horizontal blocks shim is not injecting Closure goog helpers');
        }
        for (const output of ['dist/horizontal.js', 'shim/horizontal.js']) {
          if (!fs.existsSync(output)) {
            throw new Error(`Horizontal distribution file is missing: ${output}`);
          }
        }
        console.log('Horizontal Dry Eggs block engine smoke test passed.');
        NODE
